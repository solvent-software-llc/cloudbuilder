name: Static site deploy

on:
  workflow_call:
    inputs:
      aws-role-arn:
        description: IAM role ARN for the client account (from the github-deploy-role stack output)
        required: true
        type: string
      config-path:
        description: Path to client.yaml in the calling repo
        required: false
        type: string
        default: client.yaml
      node-version:
        required: false
        type: string
        default: '22'
      cloudbuilder-ref:
        description: >
          The ref/tag of THIS reusable workflow that the caller pinned in its
          own `uses: .../static-site-deploy.yml@X` line (e.g. "v1") — pass the
          same value here so the CDK app checked out below matches the
          version of this workflow that's actually running. `github.
          job_workflow_ref`, which would otherwise let this be derived
          automatically, is not populated in every Actions environment, so
          this can't be resolved implicitly and must be passed explicitly.
        required: true
        type: string
      branch:
        description: >
          Branch to deploy. Matched against client.yaml's environments[].branch
          to pick the target environment (production, preview, ...) — the key
          prefix, subdomain, and stack it deploys to all follow from that
          environment. Defaults to the branch that triggered the run.
        required: false
        type: string
        default: ${{ github.ref_name }}

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Checkout cloudbuilder
        uses: actions/checkout@v4
        with:
          repository: solvent-software-llc/cloudbuilder
          ref: ${{ inputs.cloudbuilder-ref }}
          path: .cloudbuilder

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install site dependencies
        run: npm ci

      - name: Install cloudbuilder dependencies
        working-directory: .cloudbuilder
        run: npm ci

      # client.yaml is the single source of truth for both the CDK stack and the
      # deploy steps below. Branch -> environment matching (and the "no
      # environment declares this branch" error) lives in cloudbuilder's own
      # config.ts, not reimplemented here with yq — see bin/resolve-env.ts.
      - name: Resolve environment
        id: env
        working-directory: .cloudbuilder
        env:
          CONFIG_PATH: ${{ github.workspace }}/${{ inputs.config-path }}
          BRANCH: ${{ inputs.branch }}
        run: npx ts-node bin/resolve-env.ts

      - run: npm run check
      - run: npm run lint

      - name: Build
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws-role-arn }}
          aws-region: ${{ steps.env.outputs.region }}
          role-skip-session-tagging: true

      - name: Deploy infrastructure
        working-directory: .cloudbuilder
        env:
          CONFIG_PATH: ${{ github.workspace }}/${{ inputs.config-path }}
          STACK: ${{ steps.env.outputs.stack }}
        run: npx cdk deploy "$STACK" --require-approval never --outputs-file cdk-outputs.json

      - name: Read stack outputs
        id: stack
        env:
          STACK: ${{ steps.env.outputs.stack }}
        run: |
          OUT=.cloudbuilder/cdk-outputs.json
          BUCKET=$(jq -r --arg s "$STACK" '.[$s].BucketName' "$OUT")
          DIST=$(jq -r --arg s "$STACK" '.[$s].DistributionId' "$OUT")
          if [ -z "$BUCKET" ] || [ "$BUCKET" = "null" ] || [ -z "$DIST" ] || [ "$DIST" = "null" ]; then
            echo "::error::stack did not return BucketName and DistributionId"; exit 1
          fi
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "dist=$DIST" >> "$GITHUB_OUTPUT"

      # preview (and any other non-production) environments land under a
      # <subdomain>/ key prefix in the same bucket, routed by the distribution's
      # UrlRewriteFunction — see cloudbuilder's static-site.ts. Production
      # (no subdomain) is unprefixed.
      - name: Sync immutable assets
        env:
          BUCKET: ${{ steps.stack.outputs.bucket }}
          PREFIX: ${{ steps.env.outputs.prefix }}
        run: |
          aws s3 sync ./build/_app/immutable "s3://$BUCKET/${PREFIX}_app/immutable" \
            --exclude '*.DS_Store' \
            --cache-control 'public,max-age=31536000,immutable'

      # Stable filenames must revalidate on every visit. --delete here so the bucket
      # mirrors the build exactly. Scoped to the prefix so one environment's --delete
      # never touches another's objects in the shared bucket.
      - name: Sync unversioned files
        env:
          BUCKET: ${{ steps.stack.outputs.bucket }}
          PREFIX: ${{ steps.env.outputs.prefix }}
        run: |
          aws s3 sync ./build "s3://$BUCKET/$PREFIX" \
            --delete \
            --exclude '_app/immutable/*' \
            --exclude '*.DS_Store' \
            --cache-control 'public,max-age=0,must-revalidate'

      - name: Invalidate CloudFront
        env:
          DIST: ${{ steps.stack.outputs.dist }}
          PREFIX: ${{ steps.env.outputs.prefix }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DIST" \
            --paths "/${PREFIX}" "/${PREFIX}index.html" "/${PREFIX}404.html" "/${PREFIX}version.json"

      - name: Summary
        env:
          ENVIRONMENT: ${{ steps.env.outputs.environment }}
          DOMAIN: ${{ steps.env.outputs.target-domain }}
          STACK: ${{ steps.env.outputs.stack }}
          BUCKET: ${{ steps.stack.outputs.bucket }}
          DIST: ${{ steps.stack.outputs.dist }}
        run: |
          {
            echo "### Deployed $ENVIRONMENT to https://$DOMAIN"
            echo "- Stack: \`$STACK\`"
            echo "- Bucket: \`$BUCKET\`"
            echo "- Distribution: \`$DIST\`"
          } >> "$GITHUB_STEP_SUMMARY"
