slug: solvent-software
name: "solvent software"
domain: "solventsoftware.com"
www: false
aws:
  region: us-east-1
  hosted_zone_id: HS1234
# Present only in a site repo's client.yaml. Without it, no site stacks are
# synthesized (e.g. the API repo's client.yaml).
site:
  stack_name: custom-stack      # production's; others default to <slug>-<subdomain>-site
  bucket_name: custom-bucket    # production's; always set explicitly (no dots)
  public_env:
    PUBLIC_KEY: value
environments:
  - name: production
    branch: main
  - name: "preview build"
    subdomain: preview
    branch: dev
github:
  org: solvent-software-llc
  repos:
    - example-site
